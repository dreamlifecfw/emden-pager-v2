<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Emden Pager</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- رسالة التوعية -->
  <section id="warning" class="warning">

    <div class="card">

      <h1>⚠️ رسالة للتوعية</h1>

      <p>
        هذا الموقع مخصص للعبة داخل ماب Emden في Roblox.
        عدم استخدام مصطلحات خارج إطار اللعبة،
        وجميع الرسائل والشفرات جزء من تجربة اللعب.
      </p>

      <button id="agreeBtn" disabled>
        موافق <span id="timer">5</span>
      </button>

    </div>

  </section>


  <!-- التطبيق -->
  <main id="app" class="hidden">

    <header>

      <div>
        <small>EMDEN</small>

        <h1>Pager</h1>

        <p>نظام الرسائل وفك الشفرات</p>
      </div>

      <span class="online">
        ● متصل
      </span>

    </header>


    <!-- البيجر -->
    <section class="pager">

      <div class="pager-head">
        EMDEN PAGER
        <span>▮▮▮</span>
      </div>

      <div class="screen">

        <small>الرسائل</small>

        <div id="messages">

          <div class="empty">
            لا توجد رسائل حالياً
          </div>

        </div>

      </div>

      <div class="pager-foot">

        <span>READY</span>

        <span>01</span>

      </div>

    </section>


    <!-- الأزرار -->
    <section class="actions">

      <button id="sendOpen">

        <b>✉ إرسال رسالة</b>

        <small>
          رمز الدخول: ••••
        </small>

      </button>


      <button id="decodeOpen">

        <b>⌕ فك الشفرة</b>

        <small>
          رمز الدخول: ••••
        </small>

      </button>
